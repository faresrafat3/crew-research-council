name: heading-case

on:
  push:
    paths:
      - "RESEARCH-COUNCIL/OUTPUT/**"
      - "tools/check_heading_case.py"
      - ".github/workflows/heading-case.yml"
  pull_request:
    paths:
      - "RESEARCH-COUNCIL/OUTPUT/**"
      - "tools/check_heading_case.py"
      - ".github/workflows/heading-case.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check RESEARCH-COUNCIL/OUTPUT headings are sentence case
        run: python3 tools/check_heading_case.py
